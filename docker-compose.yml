services:
  postgres:
    image: postgres:16-alpine
    container_name: association-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: association
    ports:
      - "5432:5432"
    volumes:
      - association_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d association"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  association_pgdata:
